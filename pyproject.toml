[project]
name = "qwen3-asr"
version = "1.0.3"
description = "R2T2 offline and streaming speech recognition for CUDA and macOS CPU"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.128.0",
  "fastapi-offline==1.7.6",
  "uvicorn[standard]==0.40.0",
  "pydantic==2.12.0",
  "python-multipart==0.0.22",
  "funasr==1.3.1",
  "requests==2.32.5",
  "modelscope[framework]==1.34.0",
  "soundfile==0.13.1",
  "librosa==0.11.0",
  "websockets==16.0",
  "addict==2.4.0",
  "datasets==3.6.0",
  "scipy==1.15.3; sys_platform == 'linux'",
  "scipy==1.16.3; sys_platform == 'darwin'",
  "wetext==0.1.2",
  "python-dotenv==1.2.1",
  "huggingface_hub==0.34.0",
  "hdbscan==0.8.41",
  "loguru==0.7.2",
  "rich>=13.9,<14",
  "setuptools>=70.0.0,<81",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchvision==0.25.0",
  "transformers>=4.57,<4.58",
  "vllm[audio]==0.19.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
