name: qwen3-asr-realtime
services:
  asr:
    image: local/qwen3-asr:r2t2
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "0.0.0.0:${ASR_PORT:-4174}:8000"
    shm_size: 4gb
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU:-1}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_VISIBLE_DEVICES: "0"
      DEVICE: cuda:0
      QWEN3_ASR_MODEL: "${QWEN3_ASR_MODEL:-qwen3-asr-0.6b}"
      QWEN_GPU_MEMORY_UTILIZATION: "${QWEN_GPU_MEMORY_UTILIZATION:-0.08}"
      QWEN_FORCE_ALIGNER_GPU_MEMORY_UTILIZATION: "${QWEN_FORCE_ALIGNER_GPU_MEMORY_UTILIZATION:-0.06}"
      QWEN_VLLM_MAX_NUM_SEQS: "4"
      QWEN_VLLM_ENFORCE_EAGER: "1"
      HF_HUB_OFFLINE: "1"
      API_KEY: "${API_KEY:-}"
      R2T2_GPU_MEMORY_UTILIZATION: "${R2T2_GPU_MEMORY_UTILIZATION:-0.12}"
      R2T2_MAX_SESSIONS: "${R2T2_MAX_SESSIONS:-4}"
      R2T2_INTERNAL_TOKEN: "${R2T2_INTERNAL_TOKEN:-}"
      R2T2_ENFORCE_EAGER: "${R2T2_ENFORCE_EAGER:-0}"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models/modelscope:/root/.cache/modelscope
      - ${HF_CACHE_DIR:-/root/.cache/huggingface}:/root/.cache/huggingface
      - ./.cache/r2t2-cuda:/root/.cache/vllm
