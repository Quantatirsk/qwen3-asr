name: Ascend Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q app tests
      - run: bash -n scripts/stage-qwen-model.sh scripts/start-ascend-services.sh
      - run: docker build --check -f Dockerfile.ascend .
