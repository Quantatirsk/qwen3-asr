name: qwen3-asr

services:
  qwen3-asr:
    image: quantatrisk/qwen3-asr:gpu-latest
    container_name: qwen3-asr
    ports:
      - "${NGINX_PORT:-17003}:8000"
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models/modelscope:/root/.cache/modelscope
      - ./models/huggingface:/root/.cache/huggingface
    runtime: nvidia
    environment:
      R2T2_URL: ${R2T2_URL:-}
      R2T2_INTERNAL_TOKEN: ${R2T2_INTERNAL_TOKEN:-}
      API_KEY: ${API_KEY:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      QWEN3_ASR_MODEL: ${QWEN3_ASR_MODEL:-}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    restart: unless-stopped
