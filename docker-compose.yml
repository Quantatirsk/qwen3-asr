name: qwen3-asr-ascend

services:
  qwen3-asr:
    image: qwen3-asr:ascend-910b
    container_name: qwen3-asr
    restart: unless-stopped

    ports:
      - "17003:17003"

    shm_size: 1g

    environment:
      QWEN_ASCEND_TENSOR_PARALLEL_SIZE: "1"
      QWEN_ASCEND_MAX_MODEL_LEN: "4096"
      QWEN_ASCEND_MEMORY_UTILIZATION: "0.9"
      QWEN_ASCEND_MODEL_PATH: "/root/.cache/huggingface/hub/qwen-staged/Qwen3-ASR-1.7B"
    volumes:
      - ./models/huggingface/hub:/root/.cache/huggingface/hub
      - ./models/modelscope/hub/models:/root/.cache/modelscope/hub/models:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
    devices:
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    command:
      - /bin/bash
      - -lc
      - >-
        /workspace/qwen3-asr/scripts/stage-qwen-model.sh
        &&
        exec /workspace/qwen3-asr/scripts/start-ascend-services.sh
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:17003/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    stop_grace_period: 15s
