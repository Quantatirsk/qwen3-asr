name: r2t2-asr
services:
  asr:
    image: local/r2t2-asr:dev
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "${ASR_PORT:-4174}:8000"
    shm_size: 4gb
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU:-0}"]
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_VISIBLE_DEVICES: "0"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_ENDPOINT: "${HF_ENDPOINT:-}"
      NEMOTRON_MODEL_PATH: /app/models/nemotron-3-diarization
      API_KEY: "${API_KEY:-}"
      R2T2_INTERNAL_TOKEN: "${R2T2_INTERNAL_TOKEN:-}"
      R2T2_GPU_MEMORY_UTILIZATION: "${R2T2_GPU_MEMORY_UTILIZATION:-0.30}"
      R2T2_MAX_MODEL_LEN: "${R2T2_MAX_MODEL_LEN:-16384}"
      R2T2_MAX_SESSIONS: "${R2T2_MAX_SESSIONS:-4}"
      R2T2_ENFORCE_EAGER: "${R2T2_ENFORCE_EAGER:-0}"
      FORCED_ALIGNER_GPU_MEMORY_UTILIZATION: "${FORCED_ALIGNER_GPU_MEMORY_UTILIZATION:-0.15}"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models/nemotron-3-diarization:/app/models/nemotron-3-diarization:ro
      - ./models/modelscope:/root/.cache/modelscope
      - ./models/huggingface:/root/.cache/huggingface
      - ./.cache/vllm:/root/.cache/vllm
